    <section class="login_sec">
        <div class="contenedor_login">
            <h2 class="loginh2">Bienvenido devuelta</h2>
            <p class="login_subtitle">Ingrese su cuenta de Hero Watches</p>

            <form action="./index.html" method="post" class="Login_form">
                <div class="form_grupo">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="ingrese su email" required>
                </div>
                <div class="form_grupo">
                    <label for="password">Contraseña</label>
                    <input type="password" name="contraseña" id="password" placeholder="ingrese su contraseña" required>
                </div>
                <div class="form_grupo checkbox">
                    <label class="checkbox">
                        <input type="checkbox" name="recordarme" value="1">
                        <span> Recordarme</span>
                    </label>
                </div>
                <button type="submit" class="button_submit">Iniciar sesion</button>
            </form>
        </div>
        <div class="login_footer">
            <p>¿No tenes cuenta?</p>
            <a href="./register.html" class="link_register"> Crear una cuenta </a>
        </div>
    </section>
